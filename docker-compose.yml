services:
  ynab-mcp:
    build:
      context: .
    container_name: ynab-mcp
    restart: unless-stopped
    ports:
      - "${YNAB_MCP_BIND_ADDR:-0.0.0.0}:${YNAB_MCP_PORT:-5090}:8000"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_TRANSPORT: streamable-http
      MCP_SCRIPT_TIMEOUT_SECONDS: 90
    env_file:
      - path: ./ynab.env
        required: false
